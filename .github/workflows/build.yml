name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: Icons
        run: npx @capacitor/assets generate --android
      - name: Native patch
        run: |
          python3 scripts/patch_android.py || echo "::warning::native patch otkazib yuborildi"
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "::warning::Native patch bilan yigilmadi, oddiy variant sinab koriladi"
            if [ -f .mainactivity_path ]; then cp MainActivity.java.orig "$(cat .mainactivity_path)"; fi
            ./gradlew assembleDebug --no-daemon
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-studio.apk"
          gh release create "v${{ github.run_number }}" "apk-studio.apk" --title "apk-studio v${{ github.run_number }}" --notes "APK Studio bilan yaratildi"
